# Draws the snake eating the contribution graph at the bottom of README.md.
# The SVGs are published to the `output` branch so they never clutter main.
# Snake colors match the accent purple in scripts/build_terminal.py.

name: Generate contribution snake

on:
  schedule:
    - cron: "17 */12 * * *" # twice a day
  workflow_dispatch: # run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8250df
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#d2a8ff

      # Plain git instead of a third-party deploy action: one less dependency to break.
      - name: Publish to the output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git checkout -q -b output
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update contribution snake"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
